services:
  vaultwarden:
    image: vaultwarden/server:1.37.2
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      DOMAIN: "https://${SUBDOMAIN}.bowline.im"
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      SIGNUPS_ALLOWED: ${SIGNUPS_ALLOWED}
      LOG_FILE: "/data/vaultwarden.log"
      LOG_LEVEL: ${LOG_LEVEL}
      TZ: ${TZ}
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
    volumes:
      - ${CONFIG_PATH}/data:/data
    networks:
      - backend
      - frontend
    depends_on:
      - db
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${SUBDOMAIN}.rule=Host(`${SUBDOMAIN}.bowline.im`)"
      - "traefik.http.services.${SUBDOMAIN}.loadbalancer.server.port=80"
      - "docker-volume-backup.stop-during-backup=true"

  vaultwarden-cli:
    image: node:22-alpine
    container_name: vaultwarden-cli
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      BITWARDENCLI_APPDATA_DIR: /config
      # Reach the server directly over the backend network, bypassing Traefik
      # and public DNS. Port 80 matches the loadbalancer port above.
      BW_SERVER_URL: "http://vaultwarden:80"
    volumes:
      - ${CONFIG_PATH}/cli:/config
      - ${CONFIG_PATH}/cli/export:/export
    working_dir: /export
    networks:
      - backend
    depends_on:
      - vaultwarden
    entrypoint:
      - sh
      - -c
      - |
        npm install -g @bitwarden/cli --silent
        if [ "$$(bw status | sed -n 's/.*"status": *"\([^"]*\)".*/\1/p')" = "unauthenticated" ]; then
          bw config server "$$BW_SERVER_URL"
        fi
        exec tail -f /dev/null
    labels:
      - "docker-volume-backup.stop-during-backup=true"

  db:
    image: postgres:16-alpine
    container_name: vaultwarden-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - ${CONFIG_PATH}/db:/var/lib/postgresql/data
    networks:
      - backend
    labels:
      - "docker-volume-backup.stop-during-backup=true"

networks:
  frontend:
    external: true
  backend:
    external: true
