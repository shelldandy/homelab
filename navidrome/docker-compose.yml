services:
  navidrome:
    container_name: navidrome
    image: deluan/navidrome:latest
    restart: unless-stopped
    user: "1000:1000"
    env_file:
      - .env
    environment:
      ND_BASEURL: https://${SUBDOMAIN}.bowline.im
      TZ: ${TZ}
      ND_DEVEXTERNALSCANNER: "false"
      ND_SCANNER_SCHEDULE: "@every 15m"
      ND_PLUGINS_ENABLED: "true"
      ND_AGENTS: apple-music,lastfm
      # Make auto-imported M3U playlists (e.g. yubal's _Playlists/) visible to all users
      ND_DEFAULTPLAYLISTPUBLICVISIBILITY: "true"
    volumes:
      - ${NAVIDROME_DATA}/data:/data
      - ${NAVIDROME_DATA}/plugins:/data/plugins
      - ${MEDIA_SHARE}/media/music:/music:ro
    networks:
      - frontend
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${SUBDOMAIN}.rule=Host(`${SUBDOMAIN}.bowline.im`)"
      - "traefik.http.services.${SUBDOMAIN}.loadbalancer.server.port=4533"
      - "docker-volume-backup.stop-during-backup=true"

  #Lidarr - Used to download music
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${BASE_PATH}/lidarr/config:/config
      - ${MEDIA_SHARE}:/share
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lidarr.rule=Host(`lidarr.bowline.im`)"
      - "traefik.http.services.lidarr.loadbalancer.server.port=8686"
    networks:
      - frontend
      - backend

  soularr:
    container_name: soularr
    image: mrusse08/soularr:latest
    hostname: soularr
    restart: unless-stopped
    user: "1000:1000"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - SCRIPT_INTERVAL=300
    volumes:
      #"You can set /downloads to whatever you want but will then need to change the Slskd download dir in your config file"
      - ${MEDIA_SHARE}:/share
      #Select where you are storing your config file.
      #Leave "/data" since thats where the script expects the config file to be
      - ${BASE_PATH}/soularr:/data
      - ./data/soularr.ini:/data/config.ini
    networks:
      - backend

  slskd:
    image: slskd/slskd:latest
    container_name: slskd
    user: 1000:1000
    environment:
      - TZ=${TZ}
      - SLSKD_SLSK_USERNAME=${SLSKD_SLSK_USERNAME}
      - SLSKD_SLSK_PASSWORD=${SLSKD_SLSK_PASSWORD}
      - SLSKD_USERNAME=${SLSKD_USERNAME}
      - SLSKD_PASSWORD=${SLSKD_PASSWORD}
      - SLSKD_API_KEY=${SLSKD_API_KEY}
      - SLSKD_DOWNLOADS_DIR=${SLSKD_DOWNLOADS_DIR}
      - SLSKD_INCOMPLETE_DIR=${SLSKD_INCOMPLETE_DIR}
      - SLSKD_REMOTE_CONFIGURATION=true
    volumes:
      - ${BASE_PATH}/slskd/config:/app
      - ./data/slskd.yml:/app/slskd.yml
      - ${MEDIA_SHARE}:/share
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.slskd.rule=Host(`slskd.bowline.im`)"
      - "traefik.http.services.slskd.loadbalancer.server.port=5030"
    networks:
      - frontend
      - backend

  discoverylastfm:
    image: mrrobotogit/discoverylastfm:latest
    container_name: discoverylastfm
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=${TZ}
      - LASTFM_USERNAME=${LASTFM_USERNAME}
      - LASTFM_API_KEY=${ND_LASTFM_APIKEY}
      - MUSIC_SERVICE=lidarr
      - LIDARR_API_KEY=${LIDARR_API_KEY}
      - LIDARR_ENDPOINT=http://lidarr:8686
      - LIDARR_ROOT_FOLDER=/share/media/music
      - LIDARR_QUALITY_PROFILE_ID=${LIDARR_QUALITY_PROFILE_ID}
      - LIDARR_METADATA_PROFILE_ID=${LIDARR_METADATA_PROFILE_ID}
      - LIDARR_MONITOR_MODE=none
      - LIDARR_SEARCH_ON_ADD=false
      - RECENT_MONTHS=3
      - MIN_PLAYS=20
      - CRON_SCHEDULE=0 2 * * 0
    volumes:
      - ${BASE_PATH}/discoverylastfm/config.py:/app/config.py
    networks:
      - backend

  lastfm-album-selector:
    image: python:3.12-alpine
    container_name: lastfm-album-selector
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - LASTFM_API_KEY=${ND_LASTFM_APIKEY}
      - LIDARR_API_KEY=${LIDARR_API_KEY}
      - LIDARR_ENDPOINT=http://lidarr:8686
      - TOP_ALBUMS_COUNT=2
      - STATE_FILE=/data/processed_artists.json
      - SCRIPT_INTERVAL=3600
    volumes:
      - ./data/lastfm-album-selector:/app
      - ${BASE_PATH}/lastfm-album-selector:/data
    command: sh -c "pip install requests -q && python /app/main.py"
    networks:
      - backend

  discoverylastfm-slskd-fallback:
    image: python:3.12-alpine
    container_name: discoverylastfm-slskd-fallback
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - SLSKD_API_KEY=${SLSKD_API_KEY}
      - SLSKD_ENDPOINT=http://slskd:5030
      - DOWNLOAD_DIR=/share/media/music-inbox
      - SLSKD_DOWNLOADS_DIR=/share/downloads/slskd/downloads
      - STATE_FILE=/data/processed.json
      - SEARCH_TIMEOUT=30
    volumes:
      - ./discoverylastfm-slskd-fallback:/app
      - ${BASE_PATH}/discoverylastfm-slskd-fallback:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${MEDIA_SHARE}:/share
    command: sh -c "pip install -r /app/requirements.txt -q && python /app/main.py"
    networks:
      - backend

  beets:
    image: pspitzner/beets-flask:stable
    container_name: beets
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - USER_ID=${PUID}
      - GROUP_ID=${PGID}
    volumes:
      - ${BASE_PATH}/beets:/config
      - ./data/beets/config.yaml:/config/beets/config.yaml
      - ./data/beets-flask/config.yaml:/config/beets-flask/config.yaml
      - ${MEDIA_SHARE}/media/music:${MEDIA_SHARE}/media/music:rw
      - ${MEDIA_SHARE}/media/music-inbox:${MEDIA_SHARE}/media/music-inbox:rw
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.beets.rule=Host(`beets.bowline.im`)"
      - "traefik.http.services.beets.loadbalancer.server.port=5001"
    networks:
      - frontend

  spotiflac-server:
    build: https://github.com/ACRZeuss/spotiflac-server.git
    container_name: spotiflac-server
    restart: unless-stopped
    user: "1000:1000"
    environment:
      - TZ=${TZ}
    volumes:
      - ${MEDIA_SHARE}/media/music-inbox:/downloads
    tmpfs:
      - /.gunicorn
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${SPOTIFLAC_SUBDOMAIN}.rule=Host(`${SPOTIFLAC_SUBDOMAIN}.bowline.im`)"
      - "traefik.http.services.${SPOTIFLAC_SUBDOMAIN}.loadbalancer.server.port=5000"
      - "traefik.http.routers.${SPOTIFLAC_SUBDOMAIN}.middlewares=oidc-auth"
    networks:
      - frontend
      - backend

  spotiflac:
    image: python:3.12-alpine
    container_name: spotiflac
    restart: unless-stopped
    user: "1000:1000"
    environment:
      - TZ=${TZ}
      - TELEGRAM_BOT_TOKEN=${SPOTIFLAC_TELEGRAM_TOKEN}
      - SPOTIFY_CLIENT_ID=${SPOTIFLAC_SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFLAC_SPOTIFY_CLIENT_SECRET}
      - OUTPUT_DIR=/share/media/music-inbox
      - ALLOWED_USER_IDS=${SPOTIFLAC_ALLOWED_USER_IDS}
      - PYTHONUSERBASE=/app/.local
    volumes:
      - ./spotiflac:/app
      - ${MEDIA_SHARE}:/share
    command: sh -c "pip install --user -r /app/requirements.txt -q && python /app/main.py"
    networks:
      - backend

  # Yubal - Download tracks/albums/playlists from YouTube & YouTube Music.
  # Writes tagged files (cover art, synced lyrics, ReplayGain) straight into
  # the Navidrome library, bypassing beets - it does its own tagging.
  yubal:
    image: ghcr.io/guillevc/yubal:latest
    container_name: yubal
    restart: unless-stopped
    # NOTE: PUID/PGID, not `user:`. The entrypoint needs to start as root to
    # create /app/config/{yubal,ytdlp}, chown it, run the ensure_writable
    # preflight, then gosu-drop to PUID:PGID. Setting `user:` takes the
    # untested non-root branch and skips that guard. /app/data is chowned
    # NON-recursively upstream, so the existing library is never walked.
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - YUBAL_TZ=${TZ}
      # Dockerfile already sets 0.0.0.0; pinned here since the code default
      # is 127.0.0.1, which would be unreachable from Traefik.
      - YUBAL_HOST=0.0.0.0
      - YUBAL_AUDIO_FORMAT=opus
      - YUBAL_AUDIO_QUALITY=0
      - YUBAL_DOWNLOAD_UGC=true
      - YUBAL_FETCH_LYRICS=true
      - YUBAL_YTMUSIC_LYRICS_FALLBACK=true
      - YUBAL_REPLAYGAIN=true
      - YUBAL_SCHEDULER_ENABLED=true
      - YUBAL_SCHEDULER_CRON=${YUBAL_SCHEDULER_CRON}
      - YUBAL_JOB_TIMEOUT_SECONDS=1800
      - YUBAL_LOG_LEVEL=INFO
    volumes:
      - ${MEDIA_SHARE}/media/music:/app/data
      - ${BASE_PATH}/yubal/config:/app/config
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${YUBAL_SUBDOMAIN}.rule=Host(`${YUBAL_SUBDOMAIN}.bowline.im`)"
      - "traefik.http.services.${YUBAL_SUBDOMAIN}.loadbalancer.server.port=8000"
      - "traefik.http.routers.${YUBAL_SUBDOMAIN}.middlewares=oidc-auth"
      - "docker-volume-backup.stop-during-backup=true"
    networks:
      - frontend

networks:
  frontend:
    external: true
  backend:
    external: true
